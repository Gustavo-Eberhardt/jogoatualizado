<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Neon Breakout</title>
</head>
<body>
    <h1>NEON BREAKOUT</h1>
    <p>Setas/A-D para mover. Espaço: iniciar/pausar. R: reiniciar.</p>

    <div class="HUD">
        <span>Pontos: <strong id="score">0</strong></span>
        <span>Recorde: <strong id="best">0</strong></span>
        <span>Nível: <strong id="level">1</strong></span>
        <span>Estado: <strong id="state">PRONTO</strong></span>
    </div>

    <canvas id="game" width="480" height="560"
        aria-label="Área do jogo Neon Breakout"></canvas>

    <p class="hint">Destrua todos os tijolos. Não deixe a bola cair!</p>

    <script src="script.js"></script>
</body>
</html>
